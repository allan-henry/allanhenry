<!doctype html>
<!-- Created: 2026-09-11 20:20 MST (America/Phoenix)
     allanhenry.com portfolio: the stage. One frame at a time, full viewport,
     letterboxed on black at native aspect. Arrow keys, click halves, swipe.
     Frame index lives in the URL hash (#7) so a frame is linkable.
     Edit frames.js to change the work; this file should not need edits. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Allan Henry</title>
<meta name="description" content="Selected frames by Allan Henry, sports photographer.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="stylesheet" href="/portfolio.css">
</head>
<body>
<div class="progress" id="progress"></div>
<main class="stage" id="stage" aria-live="polite">
  <img id="frame" alt="">
  <a class="zone prev" id="prev" href="#" aria-label="previous frame"></a>
  <a class="zone next" id="next" href="#" aria-label="next frame"></a>
</main>
<div class="chrome tl"><a class="name" href="/">Allan Henry</a></div>
<div class="chrome tr"><a href="/about.html">About</a></div>
<div class="chrome bl"><div class="caption" id="caption"></div><div class="credit" id="credit"></div></div>
<div class="chrome br" id="counter"></div>

<script type="module">
import { PORTFOLIO as P } from "/frames.js";

const frames = P.frames;
const img = document.getElementById("frame");
const progress = document.getElementById("progress");
const cap = document.getElementById("caption");
const cred = document.getElementById("credit");
const counter = document.getElementById("counter");
let i = 0, token = 0;

const srcOf = (f, w) => `${P.base}/${f.file}-${w}.jpg`;
const fromHash = () => {
  const n = Number(location.hash.replace("#", ""));
  return Number.isInteger(n) && n >= 1 && n <= frames.length ? n - 1 : 0;
};

function show(n, push = true) {
  if (!frames.length) { cap.textContent = "No frames listed in frames.js yet."; return; }
  i = (n + frames.length) % frames.length;
  const f = frames[i];
  const mine = ++token;
  img.classList.remove("ready");
  progress.className = "progress on";
  // letterbox before the bytes arrive: the box takes the frame's proportions
  img.width = f.w; img.height = f.h;
  img.alt = f.caption || `${P.name}, frame ${i + 1}`;
  img.sizes = "100vw";
  img.srcset = `${srcOf(f, 1200)} 1200w, ${srcOf(f, 2400)} 2400w`;
  img.src = srcOf(f, 2400);
  const done = () => {
    if (mine !== token) return;
    img.classList.add("ready");
    progress.className = "progress done";
    setTimeout(() => { if (mine === token) progress.className = "progress"; }, 300);
  };
  img.complete && img.naturalWidth ? done() : (img.onload = done);
  img.onerror = () => { if (mine === token) { progress.className = "progress"; cap.textContent = `Could not load ${f.file}-2400.jpg`; } };

  cap.textContent = f.caption || "";
  cred.textContent = P.credit;
  counter.textContent = `${i + 1} / ${frames.length}`;
  if (push) history.replaceState(null, "", `#${i + 1}`);
  // warm the neighbours so arrowing feels instant
  for (const k of [i + 1, i - 1]) {
    const g = frames[(k + frames.length) % frames.length];
    const pre = new Image(); pre.sizes = "100vw";
    pre.srcset = `${srcOf(g, 1200)} 1200w, ${srcOf(g, 2400)} 2400w`; pre.src = srcOf(g, 2400);
  }
  wake();
}

document.getElementById("next").onclick = (e) => { e.preventDefault(); show(i + 1); };
document.getElementById("prev").onclick = (e) => { e.preventDefault(); show(i - 1); };
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); show(i + 1); }
  if (e.key === "ArrowLeft") { e.preventDefault(); show(i - 1); }
  if (e.key === "Home") show(0);
  if (e.key === "End") show(frames.length - 1);
});
let x0 = null;
const stage = document.getElementById("stage");
stage.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; wake(); }, { passive: true });
stage.addEventListener("touchend", (e) => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0; x0 = null;
  if (Math.abs(dx) > 40) show(i + (dx < 0 ? 1 : -1));
});
window.addEventListener("hashchange", () => show(fromHash(), false));

/* chrome fades after two seconds still; any movement or tap brings it back */
let idleTimer;
function wake() {
  document.body.classList.remove("idle");
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add("idle"), 2000);
}
["mousemove", "touchstart", "keydown"].forEach((ev) => document.addEventListener(ev, wake, { passive: true }));

show(fromHash(), false);
</script>
</body>
</html>
